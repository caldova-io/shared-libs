[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robobites-shared-libs"
version = "0.1.0"
description = "Shared utilities and contracts for Robobites services"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["robobites_shared*"]
