syntax = "proto3";

package caldova.contracts.v1;

import "google/protobuf/timestamp.proto";

message Money {
  string currency = 1;
  int64 cents = 2;
}

message DeliveryWindow {
  google.protobuf.Timestamp starts_at = 1;
  google.protobuf.Timestamp ends_at = 2;
}

message OrderLine {
  string sku = 1;
  string name = 2;
  int32 quantity = 3;
  Money unit_price = 4;
}

message Order {
  string order_id = 1;
  string customer_id = 2;
  string restaurant_id = 3;
  repeated OrderLine lines = 4;
  Money subtotal = 5;
  DeliveryWindow delivery_window = 6;
  string dropoff_geohash = 7;
}

enum RobotState {
  ROBOT_STATE_UNSPECIFIED = 0;
  ROBOT_STATE_IDLE = 1;
  ROBOT_STATE_ASSIGNED = 2;
  ROBOT_STATE_LOADING = 3;
  ROBOT_STATE_EN_ROUTE = 4;
  ROBOT_STATE_DOCKING = 5;
  ROBOT_STATE_MAINTENANCE = 6;
}

message BatteryStatus {
  int32 percentage = 1;
  int32 range_meters = 2;
}

message RobotStatus {
  string robot_id = 1;
  RobotState state = 2;
  BatteryStatus battery = 3;
  string active_order_id = 4;
  string current_geohash = 5;
  google.protobuf.Timestamp reported_at = 6;
}
